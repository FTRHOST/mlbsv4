name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Download Frida Libraries (Bypass LFS Budget)
        run: |
          mkdir -p native-patcher/jni/sdk/arm64-v8a
          mkdir -p native-patcher/jni/sdk/armeabi-v7a

          FRIDA_VERSION="17.15.5"
          echo "Downloading Frida GumJS Devkit v$FRIDA_VERSION..."

          # ARM64
          curl -L "https://github.com/frida/frida/releases/download/$FRIDA_VERSION/frida-gumjs-devkit-$FRIDA_VERSION-android-arm64.tar.xz" -o frida-arm64.tar.xz
          tar -xJf frida-arm64.tar.xz -C native-patcher/jni/sdk/arm64-v8a

          # ARM
          curl -L "https://github.com/frida/frida/releases/download/$FRIDA_VERSION/frida-gumjs-devkit-$FRIDA_VERSION-android-arm.tar.xz" -o frida-arm.tar.xz
          tar -xJf frida-arm.tar.xz -C native-patcher/jni/sdk/armeabi-v7a

          # The devkit tarball might contain frida-gumjs.h in the root. 
          # Move it if necessary (though project has its own).
          # Ensure libfrida-gumjs.a is in the right place.
          ls -R native-patcher/jni/sdk/

          rm frida-arm64.tar.xz frida-arm.tar.xz
          echo "Frida libraries ready."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node Dependencies
        run: npm install

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: true

      - name: Setup Secrets
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PUBLIC_KEY: ${{ secrets.PUBLIC_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          mkdir -p keys
          echo "$PRIVATE_KEY" > keys/private_key.pem
          echo "$PUBLIC_KEY" > keys/public_key.der
          echo "$FIREBASE_SERVICE_ACCOUNT" > firebase_service_account.json

      - name: Verify Firebase Configuration
        env:
          API_ROOMS_URL: ${{ secrets.API_ROOMS_URL }}
          FIREBASE_RTDB_SECRET: ${{ secrets.FIREBASE_RTDB_SECRET }}
        run: |
          echo "Verifying API_ROOMS_URL configuration..."
          if [[ "$API_ROOMS_URL" == *"firebaseio.com"* ]]; then
            echo "Detected Firebase RTDB URL."
            if [ -z "$FIREBASE_RTDB_SECRET" ]; then
              echo "::error::FIREBASE_RTDB_SECRET is empty but API_ROOMS_URL points to Firebase!"
              exit 1
            fi
            
            BASE_URL="${API_ROOMS_URL%/}"
            echo "Testing connection to Firebase RTDB..."
            
            # Database secret bypasses rules, so testing root with shallow=true should return 200
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${BASE_URL}/.json?shallow=true&auth=${FIREBASE_RTDB_SECRET}")
            
            if [ "$HTTP_STATUS" == "200" ]; then
              echo "::notice::Successfully authenticated to Firebase RTDB!"
            elif [ "$HTTP_STATUS" == "401" ]; then
              echo "::error::Authentication failed! Your FIREBASE_RTDB_SECRET is invalid or revoked. (HTTP $HTTP_STATUS)"
              exit 1
            elif [ "$HTTP_STATUS" == "404" ]; then
              echo "::error::Database not found! Your API_ROOMS_URL might be incorrect. (HTTP $HTTP_STATUS)"
              exit 1
            else
              echo "::warning::Unexpected HTTP Status: $HTTP_STATUS"
            fi
          else
            echo "API_ROOMS_URL does not point to Firebase. Skipping RTDB check."
          fi

      - name: Clean Before Build
        run: |
          cd native-patcher
          rm -rf obj/ libs/

      - name: Build JS Hook & Encrypt
        run: |
          npm run build
          cd native-patcher
          python3 encrypt.py

      - name: Build Native Patch (NDK)
        run: |
          cd native-patcher
          ./build.sh --all

      - name: Build and Sign OTA Files
        run: |
          npm run sign-ota
          npm run sign-lib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-binaries
          path: |
            public/
            native-patcher/libs/

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
