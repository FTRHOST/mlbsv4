name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Download Frida Libraries (Bypass LFS Budget)
        run: |
          mkdir -p native-patcher/jni/sdk/arm64-v8a
          mkdir -p native-patcher/jni/sdk/armeabi-v7a

          FRIDA_VERSION="17.15.5"
          echo "Downloading Frida GumJS Devkit v$FRIDA_VERSION..."

          # ARM64
          curl -L "https://github.com/frida/frida/releases/download/$FRIDA_VERSION/frida-gumjs-devkit-$FRIDA_VERSION-android-arm64.tar.xz" -o frida-arm64.tar.xz
          tar -xJf frida-arm64.tar.xz -C native-patcher/jni/sdk/arm64-v8a

          # ARM
          curl -L "https://github.com/frida/frida/releases/download/$FRIDA_VERSION/frida-gumjs-devkit-$FRIDA_VERSION-android-arm.tar.xz" -o frida-arm.tar.xz
          tar -xJf frida-arm.tar.xz -C native-patcher/jni/sdk/armeabi-v7a

          # The devkit tarball might contain frida-gumjs.h in the root. 
          # Move it if necessary (though project has its own).
          # Ensure libfrida-gumjs.a is in the right place.
          ls -R native-patcher/jni/sdk/

          rm frida-arm64.tar.xz frida-arm.tar.xz
          echo "Frida libraries ready."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node Dependencies
        run: npm install

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: true

      - name: Setup Secrets
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PUBLIC_KEY: ${{ secrets.PUBLIC_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          mkdir -p keys
          echo "$PRIVATE_KEY" > keys/private_key.pem
          echo "$PUBLIC_KEY" > keys/public_key.der
          echo "$FIREBASE_SERVICE_ACCOUNT" > firebase_service_account.json

      - name: Clean Before Build
        run: |
          cd native-patcher
          rm -rf obj/ libs/

      - name: Build JS Hook & Encrypt
        run: |
          npm run build
          cd native-patcher
          python3 encrypt.py

      - name: Build Native Patch (NDK)
        run: |
          cd native-patcher
          ./build.sh --all

      - name: Build and Sign OTA Files
        run: |
          npm run sign-ota
          npm run sign-lib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-binaries
          path: |
            public/
            native-patcher/libs/

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
