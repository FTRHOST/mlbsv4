name: Game Version Scanner

on:
  schedule:
    # Berjalan pada menit ke-0 setiap jam, HANYA pada hari Kamis (4)
    # Waktu ini menggunakan standar UTC. Jika ingin disamakan dengan WIB (UTC+7),
    # GitHub Action akan tetap mengeksekusi setiap jam, namun log-nya tertera di zona waktu UTC.
    - cron: '0 * * * 4'
    
  # Memungkinkan trigger manual lewat tombol di GitHub, 
  # atau melalui HTTP request (Webhook) dari cron-job.org jika Anda tetap ingin memakainya
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    
    # Supaya workflow ini memiliki izin untuk melakukan Push/Commit ke repository
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run scanner script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/scanner.js
